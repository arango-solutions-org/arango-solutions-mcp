version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        # Majors are excluded so each arrives as its own PR: one breaking major
        # (e.g. mcp 2.x in #23) must not block a group of safe minor/patch updates.
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        # Majors are excluded so each arrives as its own PR: one breaking major
        # (e.g. mcp 2.x in #23) must not block a group of safe minor/patch updates.
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
